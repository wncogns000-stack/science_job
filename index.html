    <p class="eyebrow" style="margin:0;color:var(--ink-2)">6학년 2학기 과학 · 4. 과학과 나의 진로</p>
    <h1>생각 디딤돌 교사용 안내</h1>
    <p>실험관찰 52~63쪽의 빈칸을 "답을 적는 칸"이 아니라 <strong>학생이 넘어야 할 사고의 점프</strong>로 보고, 점프마다 디딤돌 질문과 생각 도구, 3단 힌트를 놓은 웹앱입니다. 앱 어디에도 예시 답안은 없습니다. 힌트의 마지막 단도 문장 틀이나 초성까지만 보여 줍니다. 그래서 이 안내도 학생 화면 맨 아래 "선생님용 안내"로 열리게 두었습니다.</p>
  </section>

  <section>
    <h2>빈칸마다 필요한 사고와 앱의 생각 도구</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>실험관찰</th><th>학생이 해야 하는 사고</th><th>자주 멈추는 지점</th><th>앱의 생각 도구</th></tr></thead>
      <tbody>
        <tr><td>52쪽 조사해요 1</td><td>그림에서 변화(추세) 읽기</td><td>"아기 침대가 있다"처럼 묘사에서 멈춤</td><td>그림 읽기 3단계: 보이는 것 → 비교하는 것 → 변화의 방향 → 한 문장</td></tr>
        <tr><td>52쪽 조사해요 2</td><td>추세가 이어질 때의 결과 추론</td><td>결과 한 단계에서 멈추거나 "문제"로 이름 붙이지 못함</td><td>"그러면?" 사슬: 10년 뒤 → 20년 뒤 → 문제 문장</td></tr>
        <tr><td>53쪽 토의해요</td><td>사회 수준의 문제를 나와 우리 수준으로 옮기기</td><td>영향 ①과 ②가 같은 말의 반복</td><td>영향 확대경(나라 → 동네 → 가족 → 20년 뒤의 나), 서로 다른 생활 영역 두 개 고르기</td></tr>
        <tr><td>54~55쪽</td><td>문제에서 과학의 기여 방법 찾기</td><td>"로봇이 해결한다" 같은 일반론</td><td>두 갈래 해결 지도(원인 줄이기 / 변화에 대처하기, 교과서 87쪽 문장), "과학만으로 충분할까?"</td></tr>
        <tr><td>56쪽 과학 지식</td><td>생활 맥락에서 과학 낱말 떠올리기</td><td>"녹는다"처럼 일상어에 머무름</td><td>낱말 살펴보기: 일상어에는 "과학 낱말로 바꿔 볼까요?"로 반응</td></tr>
        <tr><td>56쪽 탐구 과정</td><td>다르게 할 조건과 같게 할 조건 정하기</td><td>두 조건을 섞거나, 궁금한 점과 상관없는 조건을 바꿈</td><td>다르게 할 것 고르기 → 같게 할 것 고르기(같은 조건을 양쪽에 고르면 알림)</td></tr>
        <tr><td>57쪽 과학 지식</td><td>직업의 일에서 초등 과학 지식 찾기</td><td>과학과 멀어 보이는 직업에서 막힘</td><td>과학 렌즈 카드 20장과 렌즈별 생각 열쇠 질문</td></tr>
        <tr><td>57쪽 탐구 과정</td><td>직업의 문제 상황을 탐구 과정으로 바꾸기</td><td>탐구 과정을 "실험"으로만 이해함</td><td>문제 상황 → 궁금한 점 → 방법(비교해 보기 / 원리 이용하기) → 정리. 교과서 예시 세 개를 두 유형으로 나눠 보여 줌</td></tr>
        <tr><td>58쪽 조사해요 1</td><td>하고 싶은 일 정하기</td><td>꿈이 정해지지 않은 학생은 시작하지 못함</td><td>"아직 모르겠어요" 경로: 좋아하는 일, 돕고 싶은 대상, 일하는 방식 고르기. 직업 이름 대신 하고 싶은 일로 써도 됨(교과서 88쪽 진로의 뜻)</td></tr>
        <tr><td>58쪽 조사해요 2</td><td>미래 기술이 내 진로에 줄 영향</td><td>"편리해진다" 수준의 막연한 문장</td><td>기술 영향 세 렌즈: 대신해 줄 일 / 도와줄 일 / 새로 생길 일</td></tr>
        <tr><td>59쪽 진로 계획</td><td>목표에서 단계별 계획 세우기</td><td>"현재" 칸에 "열심히 공부한다"</td><td>거꾸로 계획(먼 미래 → 중간 → 지금), 나이 자동 표시, "이번 주에 시작할 수 있을 만큼 작게"</td></tr>
        <tr><td>60쪽 계획하기</td><td>미래 직업 상상하기</td><td>빈 종이 앞에서 막막함</td><td>직업 조합기: 기존 직업 + 미래 기술(변신), 미래 사회 문제 + 미래 기술(탄생). 교과서 97쪽 예시의 짜임에서 가져옴</td></tr>
        <tr><td>62~63쪽</td><td>개념 점검과 적용</td><td>찍어서 맞히기</td><td>자물쇠 O/X는 오답에 정답 대신 되짚어 볼 질문을 보여 줌. 2번은 탐구 설계 틀을 다시 씀</td></tr>
      </tbody>
    </table></div>
  </section>

  <section>
    <h2>정답을 주지 않는 장치</h2>
    <ul>
      <li><strong>힌트 사다리</strong>: 1단은 관찰이나 경험을 떠올리게 하는 질문, 2단은 관점을 바꾸거나 비교 대상을 주는 질문, 3단은 문장 틀이나 초성입니다. 한 칸씩만 열립니다.</li>
      <li><strong>판정은 꼭 필요한 곳에만</strong>: 56쪽 낱말 세 개, 62쪽 O/X, 63쪽 1번 짝짓기에서만 반응합니다. 틀렸을 때는 "틀렸다" 대신 되짚어 볼 질문을 보여 줍니다.</li>
      <li><strong>도전 질문(선택)</strong>: 먼저 끝낸 학생을 위한 질문입니다. 예: "작년과 올해 두 해만 비교하고 '계속 줄어든다'고 말해도 될까?", "이 변화가 가져올 새로운 기회는?", "과학과 멀어 보이는 직업의 숨은 과학 찾기". 교과서의 생각+ 질문(85·87·91·93쪽)과 99쪽 "생각을 넓혀요"도 해당 정거장의 도전 질문이나 길잡이로 넣었습니다.</li>
      <li><strong>옮겨 쓰기 화면</strong>: 학생이 쓴 문장을 실험관찰 칸 모양으로 모아 보여 주고, 그대로 베끼지 말고 소리 내어 읽은 뒤 고쳐 쓰도록 안내합니다.</li>
    </ul>
  </section>

  <section>
    <h2>단원의 오개념 세 가지와 앱의 대응</h2>
    <p>실험관찰 62쪽 O/X에서 답이 X인 세 문장이 이 단원에서 경계할 생각입니다.</p>
    <ul>
      <li>"과학은 미래 사회의 모든 문제를 해결할 수 있다" → 정거장 2의 "과학만으로 충분할까?"(좋은 점, 걱정되는 점, 함께 필요한 것)</li>
      <li>"과학은 과학과 관련된 직업에만 필요하다" → 정거장 3의 과학 렌즈와 "숨은 과학 찾기"</li>
      <li>"직업과 관련된 과학적 요소에는 과학 지식만 포함된다" → 정거장 3·4에서 과학 지식과 과학적 탐구 과정을 늘 한 쌍으로 다룸</li>
    </ul>
  </section>

  <section>
    <h2>수업에서 쓰는 방법</h2>
    <ul>
      <li>학생 개인 기기나 모둠별 기기 한 대로 씁니다. 실험관찰을 옆에 펴 놓고, 앱에서 생각을 정리한 뒤 실험관찰에 씁니다.</li>
      <li>전체 수업에서는 교사 화면을 띄우고 "크게 보기"를 누르면 글자가 커집니다. 디딤돌 질문을 그대로 발문으로 써도 됩니다.</li>
      <li>정거장 하나가 실험관찰 한 펼침면(2쪽)에 대응합니다. 차시 배분은 학교 진도 계획에 맞추세요.</li>
      <li>54쪽 월드 카페: 학생이 쓴 내용으로 "전문가 설명 대본"이 자동으로 만들어지고, 다른 모둠에서 쓸 "시민 질문 카드"가 있습니다.</li>
      <li>61쪽 나누기: 옮겨 쓰기 화면의 "정리한 내용 복사하기"로 공유 플랫폼에 붙여 넣을 수 있습니다.</li>
    </ul>
  </section>

  <section>
    <h2>저장과 개인정보</h2>
    <ul>
      <li>서버와 로그인이 없습니다. 학생이 쓴 내용은 그 기기의 브라우저(localStorage)에만 저장되고, 교사가 모아 보는 기능은 없습니다.</li>
      <li>여럿이 함께 쓰는 기기라면 수업 뒤 학생 화면 맨 아래 "내 생각 지우기"를 눌러 주세요.</li>
      <li>시크릿 창이나 저장이 막힌 브라우저에서는 창을 닫으면 내용이 사라질 수 있습니다.</li>
      <li>외부로 나가는 요청은 글꼴(Google Fonts)뿐입니다. 글꼴이 막혀도 기기의 기본 글꼴로 동작합니다.</li>
    </ul>
  </section>

  <section>
    <h2>배포와 고쳐 쓰기</h2>
    <ul>
      <li><strong>웹 주소로 배포</strong>: 저장소 설정의 Pages 메뉴에서 이 앱이 들어 있는 브랜치와 루트 폴더를 지정하면 <code>index.html</code>이 웹 주소로 열립니다. 비공개 저장소에서 Pages를 쓸 수 있는지는 GitHub 요금제에 따라 다르니 확인이 필요합니다.</li>
      <li><strong>파일 하나로 배포</strong>: <code>dist/saenggak-didimdol.html</code>은 학생용 앱 전체를 한 파일에 담은 것입니다. 학급 플랫폼에 올리거나 기기에 복사해 열 수 있습니다. 이 안내도 함께 들어 있습니다.</li>
      <li><strong>질문과 힌트 고치기</strong>: <code>assets/s1.js</code> ~ <code>assets/s6.js</code>에 정거장별 문장이 모여 있습니다. 따옴표 안의 글만 바꾸면 됩니다. 고친 뒤 <code>python3 tools/build.py</code>를 실행하면 한 파일 버전도 새로 만들어집니다.</li>
    </ul>
  </section>

  <section>
    <h2>확인하지 못한 점과 한계</h2>
    <div class="note-box">
      <ul>
        <li>쪽수와 활동은 업로드된 교과서(80~101쪽)와 실험관찰(52~63쪽) PDF를 기준으로 했습니다. 출판사가 다른 교과서와는 맞지 않습니다.</li>
        <li>실험관찰 81쪽 "올해의 인물" 기사문 양식은 받은 PDF에 없어 확인하지 못했습니다. 앱은 제목, 첫 문단, 과학 지식과 탐구, 인터뷰 한마디로 재료를 모으게 했으니 양식의 칸 이름과 다를 수 있습니다.</li>
        <li>과학 렌즈 카드는 특정 교과서의 단원명이 아니라 초등 과학에서 다루는 주제로 묶었습니다. 학생들이 배운 단원 이름과 다를 수 있습니다.</li>
        <li>56쪽 낱말 확인은 입력에 특정 글자가 들어 있는지만 보는 단순한 방식이라, 맞춤법이나 표현에 따라 반응이 어긋날 수 있습니다.</li>
        <li>자동 클릭 테스트로 모든 화면이 오류 없이 열리는 것은 확인했지만, 실제 학생과 함께 써 본 검증은 아직 하지 않았습니다.</li>
      </ul>
    </div>
