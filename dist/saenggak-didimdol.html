<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생각 디딤돌</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="6학년 2학기 과학 4. 과학과 나의 진로 — 실험관찰 빈칸 앞에서 생각을 이어 가도록 돕는 디딤돌 질문과 힌트 사다리">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&display=swap">
<style>
/* 생각 디딤돌 — 과학과 나의 진로
   레이아웃: 홈은 '진로 여행 지도'(노선 위 6개 정거장), 정거장은 실험관찰 한 펼침면을
   디딤돌(단계) 순서로 밟아 가는 화면. 학생이 쓰는 칸은 실험관찰의 점선 줄을 닮게 한다. */
:root {
  --paper: #F5F3F9; --sheet: #FFFFFF; --ink: #241B33; --ink-2: #5E5472;
  --rule: #DCD5E8; --dot: #B3A7C7; --plum: #5B2E91; --plum-soft: #ECE4F7; --on-plum: #FFFFFF;
  --hint-bg: #FFF3C4; --hint-ink: #574300; --ok: #2F7A4B; --ok-bg: #E2F3E8; --warn: #94470A; --warn-bg: #FDEBD7;
  --t-green: #DDF0D5; --t-green-ink: #2D5A22; --t-blue: #D8EAF8; --t-blue-ink: #1E4E79;
  --t-pink: #FADDE4; --t-pink-ink: #7A2840; --t-orange: #FCE3C8; --t-orange-ink: #7A4310;
  --t-lav: #E7DDF5; --t-lav-ink: #4A2C77; --t-teal: #D3F0EC; --t-teal-ink: #1C5B54;
  --shadow: 0 1px 2px rgba(36, 27, 51, .06), 0 4px 14px rgba(36, 27, 51, .06);
  --f-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --f-hand: "Gaegu", "Nanum Pen Script", "Apple SD Gothic Neo", "Malgun Gothic", cursive;
  --lh: 2.1rem; --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #16131D; --sheet: #201B2A; --ink: #EEE9F6; --ink-2: #B7ADC8;
    --rule: #3A3249; --dot: #5E5476; --plum: #B98CF2; --plum-soft: #2E2440; --on-plum: #1A1324;
    --hint-bg: #3A3217; --hint-ink: #F3DC8A; --ok: #7FD19A; --ok-bg: #1C3325; --warn: #F2B272; --warn-bg: #3A2814;
    --t-green: #22341E; --t-green-ink: #BFE3B0; --t-blue: #1C2E40; --t-blue-ink: #AFD3F2;
    --t-pink: #3D1F28; --t-pink-ink: #F4B8C7; --t-orange: #3B2A18; --t-orange-ink: #F5C99A;
    --t-lav: #2D2440; --t-lav-ink: #D3BEF2; --t-teal: #173532; --t-teal-ink: #9FE0D6;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #16131D; --sheet: #201B2A; --ink: #EEE9F6; --ink-2: #B7ADC8;
  --rule: #3A3249; --dot: #5E5476; --plum: #B98CF2; --plum-soft: #2E2440; --on-plum: #1A1324;
  --hint-bg: #3A3217; --hint-ink: #F3DC8A; --ok: #7FD19A; --ok-bg: #1C3325; --warn: #F2B272; --warn-bg: #3A2814;
  --t-green: #22341E; --t-green-ink: #BFE3B0; --t-blue: #1C2E40; --t-blue-ink: #AFD3F2;
  --t-pink: #3D1F28; --t-pink-ink: #F4B8C7; --t-orange: #3B2A18; --t-orange-ink: #F5C99A;
  --t-lav: #2D2440; --t-lav-ink: #D3BEF2; --t-teal: #173532; --t-teal-ink: #9FE0D6;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
:root[data-size="lg"] { font-size: 19px; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--f-body); font-size: 1rem; line-height: 1.65;
  word-break: keep-all; overflow-wrap: anywhere;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
.icon { width: 1.15em; height: 1.15em; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.2em; }
a { color: var(--plum); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--plum); outline-offset: 2px; border-radius: 6px; }
#step-title:focus, #main:focus { outline: none; } /* 화면 이동 때 읽기 위치만 옮기는 곳이라 테두리를 그리지 않음 */
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.3; text-wrap: balance; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 상단 막대 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sheet); border-bottom: 1px solid var(--rule); }
.topbar .wrap { display: flex; align-items: center; gap: .5rem; min-height: 3.25rem; padding-block: .35rem; }
.topbar .title { flex: 1; min-width: 0; font-family: var(--f-display); font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-btn { text-decoration: none; display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: .35rem .8rem; cursor: pointer; font-size: .9rem; white-space: nowrap; }
.tb-btn:hover { border-color: var(--plum); }
.tb-btn[aria-pressed="true"] { background: var(--plum); color: var(--on-plum); border-color: var(--plum); }

/* ---------- 버튼 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: 999px; padding: .55rem 1.1rem; border: 1.5px solid var(--plum); background: var(--sheet); color: var(--plum); cursor: pointer; font-weight: 600; text-decoration: none; min-height: 2.6rem; }
.btn:hover { background: var(--plum-soft); }
.btn.primary { background: var(--plum); color: var(--on-plum); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: .3rem .75rem; min-height: 2.1rem; font-size: .9rem; font-weight: 500; }
.btn:disabled { opacity: .45; cursor: default; }

/* ---------- 홈: 진로 여행 지도 ---------- */
.hero { padding-block: 2rem 1.25rem; display: grid; gap: 1rem; }
.hero .eyebrow { font-size: .85rem; letter-spacing: .06em; color: var(--ink-2); }
.hero h1 { font-size: clamp(1.8rem, 5.2vw, 2.7rem); color: var(--plum); }
.hero .lead { max-width: 40rem; font-size: 1.05rem; }
.promise { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .75rem; margin: 0; padding: 0; list-style: none; counter-reset: how; }
.promise li { counter-increment: how; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: .8rem .9rem; font-size: .93rem; display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; }
.promise li::before { content: counter(how); font-family: var(--f-display); width: 1.7rem; height: 1.7rem; border-radius: 50%; display: grid; place-items: center; background: var(--plum-soft); color: var(--plum); }
.route { list-style: none; margin: 1rem 0 2.5rem; padding: 0; position: relative; display: grid; gap: .9rem; }
.route::before { content: ""; position: absolute; left: 1.6rem; top: 1rem; bottom: 1rem; width: 6px; border-radius: 3px; background: repeating-linear-gradient(to bottom, var(--rule) 0 14px, transparent 14px 22px); }
.stop { position: relative; display: grid; grid-template-columns: 3.2rem 1fr; gap: .9rem; align-items: start; }
.stop .badge { position: relative; z-index: 1; width: 3.2rem; height: 3.2rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.35rem; background: var(--sheet); border: 4px solid var(--acc-ink); color: var(--acc-ink); }
.stop.done .badge { background: var(--acc-ink); color: var(--sheet); }
.stop-card { display: grid; gap: .35rem; text-decoration: none; color: inherit; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: .9rem 1rem; box-shadow: var(--shadow); min-width: 0; }
.stop-card:hover { border-color: var(--acc-ink); }
.stop-card h2 { font-size: 1.25rem; }
.stop-card .jump { color: var(--ink-2); font-size: .92rem; }
.meta { display: flex; flex-wrap: wrap; gap: .35rem .5rem; align-items: center; font-size: .82rem; }
.pg { display: inline-flex; align-items: center; gap: .3rem; padding: .1rem .55rem; border-radius: 6px; background: var(--acc, var(--plum-soft)); color: var(--acc-ink, var(--plum)); white-space: nowrap; }
.pg.book { background: transparent; border: 1px solid var(--rule); color: var(--ink-2); }
.bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--acc-ink); border-radius: 3px; }
.foot { padding-block: 1.5rem 3rem; color: var(--ink-2); font-size: .85rem; display: grid; gap: .5rem; border-top: 1px solid var(--rule); }
.foot .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }

/* 정거장 색 */
.c-green { --acc: var(--t-green); --acc-ink: var(--t-green-ink); }
.c-blue { --acc: var(--t-blue); --acc-ink: var(--t-blue-ink); }
.c-orange { --acc: var(--t-orange); --acc-ink: var(--t-orange-ink); }
.c-pink { --acc: var(--t-pink); --acc-ink: var(--t-pink-ink); }
.c-lav { --acc: var(--t-lav); --acc-ink: var(--t-lav-ink); }
.c-teal { --acc: var(--t-teal); --acc-ink: var(--t-teal-ink); }

/* ---------- 정거장 화면 ---------- */
.st-head { padding-block: 1.25rem .5rem; display: grid; gap: .5rem; }
.st-head h1 { font-size: clamp(1.5rem, 4.4vw, 2.1rem); display: flex; gap: .6rem; align-items: center; }
.st-head h1 .num { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; display: grid; place-items: center; background: var(--acc-ink); color: var(--sheet); font-size: 1.3rem; }
.st-head .goal { margin: 0; color: var(--ink-2); }
.rail { display: flex; gap: .4rem; overflow-x: auto; padding-block: .6rem .7rem; margin: 0; list-style: none; padding-inline: 0; scrollbar-width: thin; }
.rail button { display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: .35rem .8rem; cursor: pointer; font-size: .88rem; }
.rail button .n { font-family: var(--f-display); color: var(--acc-ink); }
.rail button[aria-current="step"] { border-color: var(--acc-ink); background: var(--acc); color: var(--acc-ink); font-weight: 600; }
.rail button.filled .n::after { content: "✓"; margin-left: .2rem; }
.step { display: grid; gap: 1rem; padding-bottom: 1.5rem; }
.step > h2 { font-size: 1.4rem; display: flex; gap: .5rem; align-items: baseline; flex-wrap: wrap; }
.step > h2 small { font-family: var(--f-body); font-size: .85rem; color: var(--acc-ink); background: var(--acc); padding: .05rem .55rem; border-radius: 6px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); padding: 1rem 1.1rem; display: grid; gap: .75rem; min-width: 0; }
.card.plain { background: transparent; border: none; padding: 0; }
.say { margin: 0; }
.say strong, .card strong { color: var(--acc-ink, var(--plum)); }
.look { display: flex; gap: .6rem; align-items: flex-start; background: var(--plum-soft); color: var(--ink); border-radius: 10px; padding: .6rem .8rem; font-size: .95rem; }
.look .icon { color: var(--plum); margin-top: .2rem; }
.navrow { display: flex; justify-content: space-between; gap: .75rem; flex-wrap: wrap; padding-block: .5rem 2.5rem; }

/* 질문 + 내 생각 칸 */
.q { display: grid; gap: .5rem; align-content: start; }
.q .ask { font-weight: 600; font-size: 1.05rem; margin: 0; display: flex; gap: .5rem; align-items: flex-start; }
.q .ask .qn { flex: none; font-family: var(--f-display); font-weight: 400; color: var(--acc-ink); background: var(--acc); border-radius: 6px; padding: 0 .45rem; font-size: .95rem; line-height: 1.6; }
.q .sub { margin: 0; color: var(--ink-2); font-size: .93rem; }
.fills { justify-self: start; display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; color: var(--ink-2); border-bottom: 1.5px dotted var(--dot); padding-bottom: .05rem; }
.frame { font-size: .9rem; color: var(--ink-2); background: var(--paper); border-radius: 8px; padding: .35rem .6rem; }
.frame b { color: var(--ink); font-weight: 600; }
textarea.note, input.note {
  width: 100%; border: 1.5px solid var(--rule); border-radius: 10px; color: var(--ink); font: inherit; font-size: 1.02rem;
  background-color: var(--sheet); padding: .2rem .75rem; resize: vertical;
}
textarea.note { line-height: var(--lh); min-height: calc(var(--lh) * 2 + .5rem);
  background-image: radial-gradient(circle at 50% calc(100% - 5px), var(--dot) 1px, transparent 1.4px);
  background-size: 7px var(--lh); background-position: 0 .2rem; background-attachment: local; }
input.note { min-height: 2.6rem; }
textarea.note:focus, input.note:focus { border-color: var(--plum); outline: none; box-shadow: 0 0 0 3px var(--plum-soft); }
textarea.note::placeholder, input.note::placeholder { color: var(--ink-2); opacity: .75; }

/* 힌트 사다리 */
.ladder { display: grid; gap: .45rem; }
.ladder .lbtn { justify-self: start; display: inline-flex; gap: .4rem; align-items: center; border: 1.5px dashed var(--hint-ink); color: var(--hint-ink); background: transparent; border-radius: 999px; padding: .3rem .85rem; cursor: pointer; font-size: .9rem; }
.ladder .lbtn:hover { background: var(--hint-bg); }
.rung { background: var(--hint-bg); color: var(--hint-ink); border-radius: 10px; padding: .55rem .8rem; font-size: .95rem; display: grid; grid-template-columns: auto 1fr; gap: .55rem; }
.rung .lv { font-family: var(--f-display); font-size: .85rem; white-space: nowrap; }
.rung.last { border: 1.5px solid var(--hint-ink); }
.ladder .end { font-size: .85rem; color: var(--ink-2); }

/* 선택 칩 */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; align-items: flex-start; }
.chip { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: .35rem .85rem; cursor: pointer; font-size: .95rem; min-height: 2.4rem; text-align: left; }
.chip:hover { border-color: var(--acc-ink, var(--plum)); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--acc, var(--plum-soft)); border-color: var(--acc-ink, var(--plum)); color: var(--acc-ink, var(--plum)); font-weight: 600; }
.chip small { display: block; font-weight: 400; color: var(--ink-2); font-size: .8rem; }
.react { border-radius: 10px; padding: .55rem .8rem; font-size: .95rem; background: var(--paper); border-left: 4px solid var(--acc-ink, var(--plum)); }
.react.ok { background: var(--ok-bg); border-color: var(--ok); }
.react.warn { background: var(--warn-bg); border-color: var(--warn); }

/* 그러면? 사슬 */
.chain { display: grid; gap: .3rem; }
.chain .link { display: grid; gap: .3rem; }
.chain .start { background: var(--acc); color: var(--acc-ink); border-radius: 10px; padding: .55rem .8rem; font-weight: 600; }
.chain .then { justify-self: start; margin-left: 1rem; font-family: var(--f-display); color: var(--acc-ink); display: flex; align-items: center; gap: .3rem; }
.chain .then::before { content: ""; width: 2px; height: 1.4rem; background: var(--acc-ink); margin-right: .3rem; }

/* 카드 고르기 (과학 렌즈, 미래 기술) */
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .55rem; }
.pick { text-align: left; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 12px; padding: .6rem .7rem; cursor: pointer; display: grid; gap: .15rem; min-width: 0; }
.pick:hover { border-color: var(--acc-ink, var(--plum)); }
.pick b { font-size: .98rem; }
.pick span { font-size: .82rem; color: var(--ink-2); line-height: 1.45; }
.pick[aria-pressed="true"] { background: var(--acc, var(--plum-soft)); border-color: var(--acc-ink, var(--plum)); }
.pick[aria-pressed="true"] b { color: var(--acc-ink, var(--plum)); }
.why-list { display: grid; gap: .6rem; }

/* 여러 칸 비교 */
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: .75rem; }
.col { border: 1px solid var(--rule); border-radius: 12px; padding: .75rem; display: grid; gap: .5rem; align-content: start; min-width: 0; }
.col h3 { font-size: 1.05rem; color: var(--acc-ink); }
.col .sub { margin: 0; font-size: .88rem; color: var(--ink-2); }

/* 길잡이, 예시, 도전 */
.tip { border-radius: 12px; padding: .75rem .9rem; background: var(--paper); border: 1px dashed var(--rule); display: grid; gap: .35rem; font-size: .95rem; }
.tip h3 { font-family: var(--f-body); font-weight: 700; font-size: .95rem; display: flex; align-items: center; gap: .4rem; color: var(--ink); }
.tip ul, .tip ol { margin: 0; padding-left: 1.2rem; display: grid; gap: .2rem; }
.kw { display: flex; flex-wrap: wrap; gap: .35rem; }
.kw code { font-family: var(--f-body); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: .05rem .5rem; font-size: .88rem; }
details.ex { border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
details.ex > summary { cursor: pointer; padding: .6rem .9rem; font-weight: 600; list-style: none; display: flex; gap: .5rem; align-items: center; }
details.ex > summary::-webkit-details-marker { display: none; }
details.ex > summary::before { content: "＋"; color: var(--plum); }
details.ex[open] > summary::before { content: "－"; }
details.ex .body { padding: 0 .9rem .8rem; display: grid; gap: .5rem; font-size: .95rem; }
.challenge { border: 1.5px solid var(--plum); border-radius: 12px; padding: .75rem .9rem; display: grid; gap: .5rem; background: var(--sheet); }
.challenge .tag { justify-self: start; font-family: var(--f-display); color: var(--on-plum); background: var(--plum); border-radius: 6px; padding: 0 .5rem; font-size: .9rem; }

/* 실험관찰 옮겨 쓰기 */
.wb { display: grid; gap: 1.1rem; }
.wb-page { font-family: var(--f-display); color: var(--ink-2); font-size: 1rem; display: flex; align-items: center; gap: .5rem; }
.wb-page::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.wbox { position: relative; border: 1.5px solid var(--rule); border-radius: 16px 16px 0 16px; background: var(--sheet); padding: 1.3rem 1rem .9rem; margin-top: .6rem; display: grid; gap: .3rem; min-width: 0; }
.wbox::after { content: ""; position: absolute; right: -1.5px; bottom: -1.5px; width: 22px; height: 22px; background: linear-gradient(135deg, var(--rule) 0 50%, var(--paper) 50%); border-top-left-radius: 6px; }
.wbox .lab { position: absolute; top: -.85rem; left: 1rem; max-width: calc(100% - 2rem); background: var(--acc); color: var(--acc-ink); border: 1px solid var(--rule); border-radius: 8px; padding: .05rem .7rem; font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbox .hand { font-family: var(--f-hand); font-size: 1.28rem; line-height: 1.5; white-space: pre-wrap; }
.wbox .empty { color: var(--ink-2); font-size: .9rem; display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.wb-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: .9rem; }
.selfcheck { display: grid; gap: .45rem; margin: 0; padding: 0; list-style: none; }
.selfcheck label { display: grid; grid-template-columns: auto 1fr; gap: .6rem; align-items: start; cursor: pointer; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: .55rem .75rem; }
.selfcheck input { width: 1.25rem; height: 1.25rem; margin-top: .2rem; accent-color: var(--plum); }
.selfcheck .k { font-size: .78rem; color: var(--acc-ink); background: var(--acc); border-radius: 5px; padding: 0 .4rem; margin-right: .3rem; }

.pad .icon { width: 2.4rem; height: 2.4rem; color: var(--ink); }

.confirm { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; background: var(--warn-bg); border-radius: 10px; padding: .5rem .75rem; }


/* ---------- 선생님용 안내(#guide) ---------- */

<div id="app"><noscript><p style="padding:16px">이 앱은 자바스크립트가 켜져 있어야 동작해요.</p></noscript></div>
<template id="tpl-guide">
  <section>
    <p class="eyebrow" style="margin:0;color:var(--ink-2)">6학년 2학기 과학 · 4. 과학과 나의 진로</p>
    <h1>생각 디딤돌 교사용 안내</h1>
    <p>실험관찰 52~63쪽의 빈칸을 "답을 적는 칸"이 아니라 <strong>학생이 넘어야 할 사고의 점프</strong>로 보고, 점프마다 디딤돌 질문과 생각 도구, 3단 힌트를 놓은 웹앱입니다. 앱 어디에도 예시 답안은 없습니다. 힌트의 마지막 단도 문장 틀이나 초성까지만 보여 줍니다. 그래서 이 안내도 학생 화면 맨 아래 "선생님용 안내"로 열리게 두었습니다.</p>
  </section>

  <section>
    <h2>빈칸마다 필요한 사고와 앱의 생각 도구</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>실험관찰</th><th>학생이 해야 하는 사고</th><th>자주 멈추는 지점</th><th>앱의 생각 도구</th></tr></thead>
      <tbody>
        <tr><td>52쪽 조사해요 1</td><td>그림에서 변화(추세) 읽기</td><td>"아기 침대가 있다"처럼 묘사에서 멈춤</td><td>그림 읽기 3단계: 보이는 것 → 비교하는 것 → 변화의 방향 → 한 문장</td></tr>
        <tr><td>52쪽 조사해요 2</td><td>추세가 이어질 때의 결과 추론</td><td>결과 한 단계에서 멈추거나 "문제"로 이름 붙이지 못함</td><td>"그러면?" 사슬: 10년 뒤 → 20년 뒤 → 문제 문장</td></tr>
        <tr><td>53쪽 토의해요</td><td>사회 수준의 문제를 나와 우리 수준으로 옮기기</td><td>영향 ①과 ②가 같은 말의 반복</td><td>영향 확대경(나라 → 동네 → 가족 → 20년 뒤의 나), 서로 다른 생활 영역 두 개 고르기</td></tr>
        <tr><td>54~55쪽</td><td>문제에서 과학의 기여 방법 찾기</td><td>"로봇이 해결한다" 같은 일반론</td><td>두 갈래 해결 지도(원인 줄이기 / 변화에 대처하기, 교과서 87쪽 문장), "과학만으로 충분할까?"</td></tr>
        <tr><td>56쪽 과학 지식</td><td>생활 맥락에서 과학 낱말 떠올리기</td><td>"녹는다"처럼 일상어에 머무름</td><td>낱말 살펴보기: 일상어에는 "과학 낱말로 바꿔 볼까요?"로 반응</td></tr>
        <tr><td>56쪽 탐구 과정</td><td>다르게 할 조건과 같게 할 조건 정하기</td><td>두 조건을 섞거나, 궁금한 점과 상관없는 조건을 바꿈</td><td>다르게 할 것 고르기 → 같게 할 것 고르기(같은 조건을 양쪽에 고르면 알림)</td></tr>
        <tr><td>57쪽 과학 지식</td><td>직업의 일에서 초등 과학 지식 찾기</td><td>과학과 멀어 보이는 직업에서 막힘</td><td>과학 렌즈 카드 20장과 렌즈별 생각 열쇠 질문</td></tr>
        <tr><td>57쪽 탐구 과정</td><td>직업의 문제 상황을 탐구 과정으로 바꾸기</td><td>탐구 과정을 "실험"으로만 이해함</td><td>문제 상황 → 궁금한 점 → 방법(비교해 보기 / 원리 이용하기) → 정리. 교과서 예시 세 개를 두 유형으로 나눠 보여 줌</td></tr>

        <tr><td>60쪽 계획하기</td><td>미래 직업 상상하기</td><td>빈 종이 앞에서 막막함</td><td>직업 조합기: 기존 직업 + 미래 기술(변신), 미래 사회 문제 + 미래 기술(탄생). 교과서 97쪽 예시의 짜임에서 가져옴</td></tr>

  <section>
    <h2>정답을 주지 않는 장치</h2>
    <ul>
      <li><strong>힌트 사다리</strong>: 1단은 관찰이나 경험을 떠올리게 하는 질문, 2단은 관점을 바꾸거나 비교 대상을 주는 질문, 3단은 문장 틀이나 초성입니다. 한 칸씩만 열립니다.</li>
      <li><strong>판정은 꼭 필요한 곳에만</strong>: 56쪽 낱말 세 개, 62쪽 O/X, 63쪽 1번 짝짓기에서만 반응합니다. 틀렸을 때는 "틀렸다" 대신 되짚어 볼 질문을 보여 줍니다.</li>
      <li><strong>도전 질문(선택)</strong>: 먼저 끝낸 학생을 위한 질문입니다. 예: "작년과 올해 두 해만 비교하고 '계속 줄어든다'고 말해도 될까?", "이 변화가 가져올 새로운 기회는?", "과학과 멀어 보이는 직업의 숨은 과학 찾기". 교과서의 생각+ 질문(85·87·91·93쪽)과 99쪽 "생각을 넓혀요"도 해당 정거장의 도전 질문이나 길잡이로 넣었습니다.</li>
      <li><strong>옮겨 쓰기 화면</strong>: 학생이 쓴 문장을 실험관찰 칸 모양으로 모아 보여 주고, 그대로 베끼지 말고 소리 내어 읽은 뒤 고쳐 쓰도록 안내합니다.</li>
    </ul>
  </section>

  <section>
    <h2>단원의 오개념 세 가지와 앱의 대응</h2>
    <p>실험관찰 62쪽 O/X에서 답이 X인 세 문장이 이 단원에서 경계할 생각입니다.</p>
    <ul>
      <li>"과학은 미래 사회의 모든 문제를 해결할 수 있다" → 정거장 2의 "과학만으로 충분할까?"(좋은 점, 걱정되는 점, 함께 필요한 것)</li>
      <li>"과학은 과학과 관련된 직업에만 필요하다" → 정거장 3의 과학 렌즈와 "숨은 과학 찾기"</li>
      <li>"직업과 관련된 과학적 요소에는 과학 지식만 포함된다" → 정거장 3·4에서 과학 지식과 과학적 탐구 과정을 늘 한 쌍으로 다룸</li>
    </ul>
  </section>

  <section>
    <h2>수업에서 쓰는 방법</h2>
    <ul>
      <li>학생 개인 기기나 모둠별 기기 한 대로 씁니다. 실험관찰을 옆에 펴 놓고, 앱에서 생각을 정리한 뒤 실험관찰에 씁니다.</li>
      <li>전체 수업에서는 교사 화면을 띄우고 "크게 보기"를 누르면 글자가 커집니다. 디딤돌 질문을 그대로 발문으로 써도 됩니다.</li>
      <li>정거장 하나가 실험관찰 한 펼침면(2쪽)에 대응합니다. 차시 배분은 학교 진도 계획에 맞추세요.</li>
      <li>54쪽 월드 카페: 학생이 쓴 내용으로 "전문가 설명 대본"이 자동으로 만들어지고, 다른 모둠에서 쓸 "시민 질문 카드"가 있습니다.</li>
      <li>61쪽 나누기: 옮겨 쓰기 화면의 "정리한 내용 복사하기"로 공유 플랫폼에 붙여 넣을 수 있습니다.</li>
    </ul>
  </section>

  <section>
    <h2>저장과 개인정보</h2>
    <ul>
      <li>서버와 로그인이 없습니다. 학생이 쓴 내용은 그 기기의 브라우저(localStorage)에만 저장되고, 교사가 모아 보는 기능은 없습니다.</li>

      <li>외부로 나가는 요청은 글꼴(Google Fonts)뿐입니다. 글꼴이 막혀도 기기의 기본 글꼴로 동작합니다.</li>

    <h2>배포와 고쳐 쓰기</h2>
    <ul>
      <li><strong>웹 주소로 배포</strong>: 저장소 설정의 Pages 메뉴에서 이 앱이 들어 있는 브랜치와 루트 폴더를 지정하면 <code>index.html</code>이 웹 주소로 열립니다. 비공개 저장소에서 Pages를 쓸 수 있는지는 GitHub 요금제에 따라 다르니 확인이 필요합니다.</li>

      <li><strong>질문과 힌트 고치기</strong>: <code>assets/s1.js</code> ~ <code>assets/s6.js</code>에 정거장별 문장이 모여 있습니다. 따옴표 안의 글만 바꾸면 됩니다. 고친 뒤 <code>python3 tools/build.py</code>를 실행하면 한 파일 버전도 새로 만들어집니다.</li>
    </ul>
  </section>

  <section>
    <h2>확인하지 못한 점과 한계</h2>
