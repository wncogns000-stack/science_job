<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미래 직업 박람회 2045</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="6학년 2학기 과학 4단원 과학과 나의 진로 · 미래 사회의 문제를 과학으로 해결하는 미래 직업 부스를 둘러보고, 탐구 미션으로 도장을 모으고, 나만의 미래 직업 카드를 만드는 사이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&display=swap">
<style>
/* 미래 직업 박람회 2045
   레이아웃: 남색 박람회 간판(머리) 아래에 입장권과 2×2 존 지도, 존마다 줄무늬 차양을 단 부스 카드.
   여권 도장과 입장권 같은 박람회 소품을 화면 요소로 쓴다. 존 색: 인구 산호, 환경 초록, 안전 남보라, 생활 황토. */
:root {
  --bg: #F1F5FB; --sheet: #FFFFFF; --ink: #0F1E3D; --ink-2: #4A5A78; --line: #D6DEEC;
  --head: #13285A; --on-head: #FFFFFF; --head-2: #B9C8EC; --ticket: #FFD23F; --on-ticket: #13285A;
  --btn: #13285A; --on-btn: #FFFFFF; --ok: #1B7A4B; --ok-bg: #DDF2E5; --no: #B3261E; --no-bg: #FCE4E1;
  --pop: #C23A22; --pop-soft: #FDE6E0; --env: #1B7A4B; --env-soft: #DDF2E5;
  --safe: #4A4FCF; --safe-soft: #E5E6FB; --life: #9A5B00; --life-soft: #FBEFD8; --on-z: #FFFFFF;
  --shadow: 0 2px 4px rgba(15, 30, 61, .06), 0 10px 24px rgba(15, 30, 61, .08);
  --f-disp: "Black Han Sans", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-fun: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --sheet: #151E34; --ink: #EAF0FB; --ink-2: #A9B6CF; --line: #2A3756;
    --head: #070C19; --on-head: #FFFFFF; --head-2: #9FB2DF; --ticket: #FFD23F; --on-ticket: #13285A;
    --btn: #DCE6FF; --on-btn: #0C1222; --ok: #6FD49C; --ok-bg: #15301F; --no: #FF9A8C; --no-bg: #3A1B18;
    --pop: #FF9A85; --pop-soft: #3A1E19; --env: #6FD49C; --env-soft: #15301F;
    --safe: #AEB2FF; --safe-soft: #1F2147; --life: #F5BE62; --life-soft: #3A2A10; --on-z: #0C1222;
    --shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 10px 24px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --sheet: #151E34; --ink: #EAF0FB; --ink-2: #A9B6CF; --line: #2A3756;
  --head: #070C19; --on-head: #FFFFFF; --head-2: #9FB2DF; --ticket: #FFD23F; --on-ticket: #13285A;
  --btn: #DCE6FF; --on-btn: #0C1222; --ok: #6FD49C; --ok-bg: #15301F; --no: #FF9A8C; --no-bg: #3A1B18;
  --pop: #FF9A85; --pop-soft: #3A1E19; --env: #6FD49C; --env-soft: #15301F;
  --safe: #AEB2FF; --safe-soft: #1F2147; --life: #F5BE62; --life-soft: #3A2A10; --on-z: #0C1222;
  --shadow: 0 2px 4px rgba(0, 0, 0, .3), 0 10px 24px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
.z-pop { --z: var(--pop); --zs: var(--pop-soft); }
.z-env { --z: var(--env); --zs: var(--env-soft); }
.z-safe { --z: var(--safe); --zs: var(--safe-soft); }
.z-life { --z: var(--life); --zs: var(--life-soft); }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
a { color: inherit; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ticket); outline-offset: 2px; border-radius: 6px; }
#main:focus { outline: none; }
h1, h2 { font-family: var(--f-disp); font-weight: 400; line-height: 1.25; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.8rem, 5.4vw, 3rem); }
h2 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 760px; }
main { display: grid; gap: 1.4rem; padding-block: 1.4rem 2.5rem; }
.sub { margin: 0; color: var(--ink-2); }
.kicker { margin: 0; font-size: .85rem; letter-spacing: .06em; color: var(--ink-2); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }

/* 박람회 간판 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--on-head); }
.topin { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-block: .55rem; }
.logo { display: inline-flex; align-items: baseline; gap: .45rem; text-decoration: none; }
.logo .l1 { font-family: var(--f-disp); font-size: 1.3rem; }
.logo .l2 { font-family: var(--f-fun); background: var(--ticket); color: var(--on-ticket); border-radius: 6px; padding: 0 .4rem; font-size: .95rem; }
.mainnav { display: flex; gap: .2rem; flex-wrap: wrap; margin-left: auto; }
.mainnav a { text-decoration: none; color: var(--head-2); padding: .3rem .65rem; border-radius: 999px; font-size: .92rem; white-space: nowrap; }
.mainnav a:hover { color: var(--on-head); }
.mainnav a[aria-current="page"] { background: rgba(255, 255, 255, .14); color: var(--on-head); }

/* 버튼 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-height: 2.75rem; padding: .5rem 1.15rem; border-radius: 999px; border: 2px solid var(--btn); background: var(--btn); color: var(--on-btn); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { filter: brightness(1.12); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.small { min-height: 2.2rem; padding: .25rem .8rem; font-size: .9rem; }
.row, .next { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin: 0; }
.next { justify-content: space-between; }

/* 첫 화면 */
.hero { display: grid; gap: .8rem; padding-block: 1rem .4rem; }
.hero h1 { max-width: 18ch; }
.lead { margin: 0; max-width: 44rem; font-size: 1.05rem; }
.heroacts { display: flex; flex-wrap: wrap; gap: .7rem; align-items: center; margin-top: .3rem; }
.ticket { display: inline-grid; grid-template-columns: auto auto; align-items: center; text-decoration: none; background: var(--ticket); color: var(--on-ticket); min-height: 3.2rem;
  -webkit-mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat;
  mask: radial-gradient(circle at 0 50%, transparent 9px, #000 9.5px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 9px, #000 9.5px) right / 51% 100% no-repeat; }
.ticket .t1 { font-family: var(--f-fun); padding: .45rem .9rem .45rem 1.3rem; border-right: 2px dashed rgba(19, 40, 90, .45); }
.ticket .t2 { font-weight: 700; padding: .45rem 1.3rem .45rem .9rem; }
.ticket:hover { filter: brightness(1.05); }

/* 존 지도 */
.map { display: grid; gap: .6rem; scroll-margin-top: 4.5rem; }
.zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.zone { position: relative; display: grid; gap: .35rem; text-decoration: none; background: var(--sheet); border: 2px solid var(--line); border-radius: 18px; padding: 1.1rem 1.2rem 1rem; box-shadow: var(--shadow); overflow: hidden; }
.zone::before { content: ""; position: absolute; inset: 0 0 auto; height: 8px; background: var(--z); }
.zone:hover { border-color: var(--z); }
.zicon { font-size: 2.2rem; line-height: 1; }
.zt { font-family: var(--f-disp); font-size: 1.45rem; color: var(--z); }
.zp { color: var(--ink-2); font-size: .95rem; }
.zbar { display: block; height: 8px; border-radius: 4px; background: var(--zs); overflow: hidden; }
.zbar i { display: block; height: 100%; background: var(--z); }
.zc { font-size: .88rem; font-weight: 600; }

/* 부스 카드 */
.all { display: grid; gap: .7rem; }
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); gap: .5rem; }
.search, .filters select, .fld input, .fld select, .fld textarea, .guide textarea, #savebox textarea { width: 100%; min-height: 2.75rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--sheet); padding: .45rem .8rem; }
.booths { display: grid; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); gap: 1rem; }
.booth { position: relative; display: grid; gap: .35rem; align-content: start; text-decoration: none; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 16px; padding: 0 1rem 1rem; box-shadow: var(--shadow); overflow: hidden; transition: transform .15s ease; }
.booth:hover { transform: translateY(-3px); border-color: var(--z); }
.awning { display: block; margin: 0 -1rem .3rem; height: 34px;
  background: radial-gradient(circle at 50% 0, var(--z) 10px, transparent 10.5px) 0 22px / 22px 12px repeat-x, repeating-linear-gradient(90deg, var(--z) 0 22px, var(--zs) 22px 44px) 0 0 / 100% 22px no-repeat; }
.booth .emoji { font-size: 2.3rem; line-height: 1.1; }
.bname { font-family: var(--f-disp); font-size: 1.25rem; }
.hook { color: var(--ink-2); font-size: .94rem; }
.bmeta { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; margin-top: .2rem; }
.zname { font-size: .8rem; color: var(--z); font-weight: 600; }
.booth .why { font-size: .85rem; background: var(--zs); border-radius: 8px; padding: .25rem .55rem; }
.pill { font-family: var(--f-fun); font-size: .82rem; border-radius: 999px; padding: .02rem .55rem; border: 1.5px solid currentColor; }
.st-now { color: var(--ok); }
.st-grow { color: var(--safe); }
.st-imagine { color: var(--pop); }
.stamp { position: absolute; top: 2.6rem; right: .8rem; width: 4.2rem; height: 4.2rem; border-radius: 50%; border: 4px double var(--z, var(--pop)); color: var(--z, var(--pop)); display: grid; place-items: center; font-family: var(--f-fun); font-size: 1.05rem; transform: rotate(-14deg); background: var(--sheet); opacity: .95; }
.stamp.small { width: 3.2rem; height: 3.2rem; font-size: .85rem; border-width: 3px; }

/* 존 입구 */
.crumb { font-size: .88rem; color: var(--ink-2); }
.crumb a { color: var(--ink-2); }
.gate { position: relative; display: grid; gap: .7rem; background: var(--zs); border: 2px solid var(--z); border-radius: 20px; padding: 1.3rem 1.4rem; }
.gate h1 { color: var(--z); }
.gicon { font-size: 2.6rem; line-height: 1; }
.flow { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .7rem; counter-reset: f; }
.flow li { counter-increment: f; background: var(--sheet); border-radius: 14px; padding: .8rem .9rem; display: grid; gap: .25rem; position: relative; }
.flow li b { font-family: var(--f-fun); font-weight: 400; color: var(--z); }
.flow li b::before { content: counter(f) " "; }
.flow li:not(:last-child)::after { content: "→"; position: absolute; right: -.62rem; top: 50%; transform: translateY(-50%); color: var(--z); font-weight: 700; }
.book { margin: 0; font-size: .85rem; color: var(--ink-2); }

/* 부스 안 */
.jobhead { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 1.1rem; align-items: center; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 20px; padding: 0 1.3rem 1.2rem; overflow: hidden; box-shadow: var(--shadow); }
.jobhead .awning { grid-column: 1 / -1; margin: 0 -1.3rem; }
.bigemoji { font-size: 4rem; line-height: 1; width: 6rem; height: 6rem; border-radius: 50%; background: var(--zs); display: grid; place-items: center; }
.jt { display: grid; gap: .3rem; min-width: 0; }
.hookq { margin: 0; font-size: 1.08rem; color: var(--ink-2); }
.bookref { font-size: .8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 0 .45rem; }
.jobgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.panel { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 16px; padding: 1rem 1.1rem; display: grid; gap: .55rem; align-content: start; min-width: 0; }
.panel h2 { font-size: 1.15rem; }
.panel p { margin: 0; }
.panel.wide { grid-column: 1 / -1; }
.know { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .6rem; }
.know li { display: grid; gap: .15rem; background: var(--bg); border-radius: 12px; padding: .6rem .75rem; }
.know b { font-family: var(--f-fun); font-weight: 400; font-size: 1.05rem; }
.tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.tag { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .65rem; font-size: .9rem; }

/* 도장 미션 */
.mission { position: relative; display: grid; gap: .6rem; background: var(--sheet); border: 2.5px dashed var(--z, var(--line)); border-radius: 18px; padding: 1.1rem 1.2rem 1.2rem; }
.mission h2 { font-size: 1.25rem; }
.mission .sit { margin: 0; font-size: 1.05rem; padding-right: 4.5rem; }
.mission p { margin: 0; }
.opts { display: grid; gap: .5rem; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: 14px; padding: .7rem .9rem; cursor: pointer; line-height: 1.5; }
.opt:hover { border-color: var(--ink-2); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--no); background: var(--no-bg); }
.fb { min-height: 1.4em; font-weight: 600; }
.fb.ok { color: var(--ok); }
.fb.no { color: var(--no); }
.mission .stamp { top: 1rem; right: 1rem; }
.mission.pop .stamp { animation: stampin .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampin { from { transform: rotate(-30deg) scale(2.2); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: .95; } }

/* 나에게 맞는 부스 */
.dots { display: flex; gap: .4rem; margin: 0; }
.dots span { width: .8rem; height: .8rem; border-radius: 50%; background: var(--line); }
.dots span.on { background: var(--ink-2); }
.dots span.cur { background: var(--ticket); outline: 2px solid var(--on-ticket); }
.fq { font-size: 1.5rem; }
.answers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
.ans { min-height: 4.2rem; border: 2px solid var(--line); background: var(--sheet); border-radius: 16px; font-size: 1.08rem; cursor: pointer; padding: .6rem .8rem; box-shadow: var(--shadow); }
.ans:hover { border-color: var(--ink-2); transform: translateY(-2px); }
.result { display: grid; gap: .3rem; }

/* 여권 */
.passhead { background: var(--head); color: var(--on-head); border-radius: 20px; padding: 1.3rem 1.4rem; display: grid; gap: .35rem; }
.passhead .kicker, .passhead .sub { color: var(--head-2); }
.badges { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr)); gap: .6rem; }
.badges li { display: grid; grid-template-columns: auto 1fr; column-gap: .55rem; align-items: center; background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: .55rem .75rem; color: var(--ink-2); }
.badges li span:last-child { grid-column: 2; font-size: .82rem; }
.badges li.got { color: var(--ink); border-color: var(--ticket); }
.bi { grid-row: span 2; font-size: 1.6rem; color: var(--ticket); }
.pzone { display: grid; gap: .6rem; }
.pzone h2 { color: var(--z); font-size: 1.2rem; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: .6rem; }
.slot { display: grid; justify-items: center; gap: .3rem; text-decoration: none; text-align: center; background: var(--sheet); border: 2px dashed var(--line); border-radius: 16px; padding: .8rem .5rem; color: var(--ink-2); }
.se { width: 3.6rem; height: 3.6rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.7rem; border: 3px dashed var(--line); }
.slot.got { border-style: solid; border-color: var(--z); color: var(--ink); }
.slot.got .se { border: 4px double var(--z); transform: rotate(-12deg); background: var(--zs); }
.sn { font-size: .85rem; line-height: 1.35; }

/* 부스 만들기 */
.mixrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto; gap: .6rem; align-items: end; }
.plus { font-family: var(--f-disp); font-size: 1.8rem; padding-bottom: .3rem; }
.mixq { margin: 0; background: var(--bg); border-radius: 12px; padding: .65rem .85rem; }
.fld { display: grid; gap: .3rem; }
.fld > span { font-weight: 600; font-size: .95rem; }
.fld textarea { min-height: 5.5rem; resize: vertical; }
.emos { display: flex; flex-wrap: wrap; gap: .35rem; }
.emo { width: 2.75rem; height: 2.75rem; border-radius: 12px; border: 2px solid var(--line); background: var(--sheet); font-size: 1.35rem; cursor: pointer; }
.emo[aria-pressed="true"] { border-color: var(--btn); background: var(--ticket); }
.mycard { --z: var(--pop); --zs: var(--pop-soft); position: relative; max-width: 26rem; justify-self: center; width: 100%; background: var(--sheet); border: 2px solid var(--line); border-radius: 22px; padding: 0 1.2rem 1.1rem; overflow: hidden; display: grid; gap: .45rem; box-shadow: var(--shadow); }
.mycard .awning { margin: 0 -1.2rem .2rem; }
.mycard .bigemoji { justify-self: center; }
.mycard .cn { margin: 0; text-align: center; font-family: var(--f-disp); font-size: 1.6rem; line-height: 1.25; }
.mycard .cmix { margin: 0; text-align: center; color: var(--ink-2); font-size: .9rem; }
.mycard .cs b { color: var(--z); font-family: var(--f-fun); font-weight: 400; }
.mycard .cs p { margin: 0; }
.mycard .cf { margin: .3rem 0 0; text-align: center; color: var(--ink-2); font-size: .82rem; }
.cardimg { max-width: min(100%, 26rem); border-radius: 16px; border: 1px solid var(--line); }
.starters { margin: 0; padding-left: 1.1rem; display: grid; gap: .25rem; }
.guard { font-size: .9rem; color: var(--ink-2); }

/* 안내, 바닥 */
.guide h2 { font-size: 1.3rem; }
.guide ul { margin: 0; padding-left: 1.2rem; display: grid; gap: .35rem; }
.tablewrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 14px; background: var(--sheet); }
table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .92rem; }
th, td { text-align: left; vertical-align: top; padding: .6rem .75rem; border-bottom: 1px solid var(--line); }
th { background: var(--bg); }
tr:last-child td { border-bottom: none; }
.foot { padding-block: 1.2rem 2.5rem; border-top: 1px solid var(--line); color: var(--ink-2); font-size: .85rem; display: grid; gap: .3rem; }
.foot p { margin: 0; }
.confirm { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; background: var(--no-bg); border-radius: 12px; padding: .55rem .8rem; }
.toast { position: fixed; left: 50%; bottom: calc(1.2rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: .6rem 1.1rem; border-radius: 999px; z-index: 20; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .zones, .jobgrid, .answers { grid-template-columns: 1fr; }
  .filters { grid-template-columns: 1fr 1fr; }
  .filters .search { grid-column: 1 / -1; }
  .flow { grid-template-columns: 1fr; }
  .flow li:not(:last-child)::after { content: "↓"; right: 50%; top: auto; bottom: -.95rem; transform: none; }
  .mixrow { grid-template-columns: 1fr; }
  .plus { display: none; }
  .jobhead { grid-template-columns: 1fr; justify-items: start; }
